[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = "!{Country}"

[env.production]
  DATABASE_URL = ""
  DIRECT_URL = ""
  NEXTAUTH_URL = "https://yourdomain.netlify.app"
  NEXTAUTH_SECRET = ""
  GITHUB_ID = ""
  GITHUB_SECRET = ""
  ADMIN_EMAIL = ""
  NEXT_PUBLIC_SUPABASE_URL = ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY = ""
